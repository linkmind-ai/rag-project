[project]
name = "rag-project"
version = "0.1.0"
description = "LangGraph based Multi-turn RAG System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.6",
    "aiohttp>=3.9.1",
    "langchain>=0.1.0",
    "langchain-community>=0.2.0",
    "langchain-core>=0.2.0,<0.3.0",
    "langgraph",
    "langchain-text-splitters>=0.2.0",
    "elasticsearch[async]>=9.1.2",
    "aiofiles>=23.2.1",
    "pypdf>=4.0.1",
    "python-docx>=1.1.0",
    "asyncio>=3.4.3",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.2",
    "streamlit==1.51.0",
    "ragas>=0.4.3",
    "langchain-ollama>=0.1.3",
    "langchain-openai>=0.1.25",
    "lark>=1.3.1",
]

[dependency-groups]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.4",
    "black>=24.1.1",
    "isort>=5.13.2",
    "httpx>=0.26.0",
    "urllib3>=2.1.0",
    "ruff>=0.15.0",
]
eval = [
    "ragas>=0.2.0",
    "langchain-groq>=0.1.0",
    "langchain-ollama>=0.1.0",
]

[tool.ruff]
cache-dir = "~/.cache/ruff"
target-version = "py311"
line-length = 88
exclude = ["apps/gear/gear_origin.py", "apps/gear/query.py"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "B", "UP",
    "N",
    "S",
    "ANN",
    "RUF",
]
ignore = ["D100", "D104",  "E501", "B008"]

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["S101"]
"apps/gear/gear_origin.py" = ["ALL"]
"apps/common/config.py" = ["S104"]
"apps/gear/config.py" = ["S104"]
"apps/utils/notion_connector.py" = ["ANN401"]
